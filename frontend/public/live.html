<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>ASSBI Live</title>
  <style>
    html, body { margin: 0; height: 100%; background: #070b1f; color: #f8fafc; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .page { min-height: 100%; display: flex; flex-direction: column; }
    .top { height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 22px; border-bottom: 1px solid rgba(255,255,255,.1); background: rgba(10,16,43,.95); }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: .01em; }
    .logo { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg,#3b82f6,#7c3aed); display: grid; place-items: center; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    a, button { border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.08); color: white; border-radius: 10px; padding: 10px 14px; text-decoration: none; font-weight: 700; cursor: pointer; }
    .primary { background: #3b82f6; border-color: #3b82f6; }
    .wrap { flex: 1; padding: 18px; display: grid; grid-template-rows: auto 1fr; gap: 14px; }
    .status { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: #cbd5e1; }
    .pill { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 8px 12px; background: rgba(34,197,94,.12); color: #22c55e; border: 1px solid rgba(34,197,94,.24); font-weight: 800; }
    .dot { width: 8px; height: 8px; border-radius: 999px; background: #22c55e; box-shadow: 0 0 18px #22c55e; }
    .player { min-height: 0; border: 1px solid rgba(255,255,255,.12); border-radius: 18px; overflow: hidden; background: #000; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
    iframe { width: 100%; height: calc(100vh - 150px); min-height: 420px; border: 0; display: block; background: #000; }
    @media (max-width: 720px) { .top { height: auto; min-height: 64px; align-items: flex-start; flex-direction: column; padding: 14px; } .actions { width: 100%; justify-content: stretch; } a, button { flex: 1; text-align: center; } .wrap { padding: 10px; } iframe { height: calc(100vh - 210px); min-height: 360px; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <div class="brand"><div class="logo">▶</div><div>ASSBI Live Camera</div></div>
      <div class="actions">
        <a class="primary" href="/surveillance?fresh=3">Dashboard</a>
        <a href="/">Login / Home</a>
        <button type="button" onclick="location.reload()">Reload</button>
      </div>
    </header>
    <section class="wrap">
      <div class="status">
        <div><strong>fd</strong> · YouTube live source</div>
        <div class="pill"><span class="dot"></span> ORIGINAL LIVE</div>
      </div>
      <div class="player">
        <iframe src="https://www.youtube.com/embed/gFRtAAmiFbE?autoplay=1&mute=1&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
    </section>
  </main>
</body>
</html>
