services:
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      - bgutil-provider
    environment:
      YOUTUBE_POT_PROVIDER_URL: http://bgutil-provider:4416
    volumes:
      - ./data:/app/data
      - ./frames:/app/frames
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./exports:/app/exports
      - ./streams:/app/streams
      - ./models:/app/models:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
