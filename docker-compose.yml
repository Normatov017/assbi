services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./frames:/app/frames
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./exports:/app/exports
      - ./streams:/app/streams
      - ./models:/app/models:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
