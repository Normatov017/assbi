services:
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        REQUIREMENTS_FILE: requirements-detector.txt
        ASSBI_LIGHTWEIGHT_DETECTOR: "0"
    restart: unless-stopped
    depends_on:
      - bgutil-provider
    environment:
      YOUTUBE_POT_PROVIDER_URL: http://bgutil-provider:4416
      YTDLP_NO_LAZY_EXTRACTORS: "1"
    volumes:
      - ./data:/app/data
      - ./frames:/app/frames
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./exports:/app/exports
      - ./streams:/app/streams
      - ./models:/app/models
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
